general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/xylvzm/Downloads/gruvboxwallpaper.webp
    color = rgb(000200)

    blur_passes = 2
    blur_size = 6
    noise = 0.01
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.1
}

label {
    monitor =
    text = $TIME
    color = rgb(e9d9b6)
    font_size = 80
    font_family = JetBrainsMono Nerd Font

    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] date '+%A, %d %B'
    color = rgb(ba9f64)
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, 60
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 54
    outline_thickness = 2
    rounding = 10

    outer_color = rgb(8c3936) rgb(ba9f64) 45deg
    inner_color = rgb(000200)
    font_color = rgb(e9d9b6)
    font_family = JetBrainsMono Nerd Font

    check_color = rgb(6b9e67)
    fail_color = rgb(8c3936)
    capslock_color = rgb(edbb26)

    placeholder_text = <i>Password</i>
    fail_text = <i>Incorrect password · try again</i>

    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    fade_on_empty = false

    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter password to unlock
    color = rgb(85a699)
    font_size = 11
    font_family = JetBrainsMono Nerd Font

    position = 0, -105
    halign = center
    valign = center
}
